<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders - FoodMunch</title>

    <link rel="stylesheet"
          href="/studentfood.css">

    <style>
        body {
            background: #fffdf5;
        }

        .my-orders-page {
            padding: 120px 20px 60px;
            min-height: 100vh;
        }

        .my-orders-container {
            max-width: 1100px;
            margin: auto;
        }

        .my-orders-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .my-orders-title h1 {
            font-size: 42px;
            font-weight: 700;
            color: #222;
            margin-bottom: 10px;
        }

        .my-orders-title p {
            font-size: 18px;
            color: #777;
        }

        .my-order-items {
            width: 100%;
        }

        .my-order-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border-left: 7px solid #f5c400;
        }

        .my-order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            padding-bottom: 18px;
            border-bottom: 1px solid #eee;
        }

        .my-order-card-header h3 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #222;
        }

        .my-order-card-header span {
            color: #777;
            font-size: 16px;
        }

        .order-status {
            background: #fff3c4;
            color: #806600 !important;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 700;
            white-space: nowrap;
        }

        .my-order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            padding: 25px 0;
        }

        .order-detail-row {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .order-detail-row span {
            color: #333;
            font-size: 17px;
            font-weight: 600;
        }

        .order-detail-row strong {
            color: #777;
            font-size: 17px;
        }

        .customer-order-details {
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .customer-order-details h4 {
            font-size: 25px;
            margin-bottom: 20px;
            color: #222;
        }

        .customer-order-details p {
            font-size: 17px;
            color: #555;
            margin: 12px 0;
            line-height: 1.6;
        }

        .back-home-btn {
            display: block;
            width: fit-content;
            margin: 0 auto 35px;
            padding: 12px 25px;
            background: #f5c400;
            color: #222;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 700;
        }

        .back-home-btn:hover {
            text-decoration: none;
            color: #222;
        }

        @media (max-width: 600px) {

            .my-orders-page {
                padding: 100px 15px 40px;
            }

            .my-orders-title h1 {
                font-size: 32px;
            }

            .my-orders-title p {
                font-size: 16px;
            }

            .my-order-card {
                padding: 22px 18px;
                border-radius: 18px;
            }

            .my-order-card-header {
                flex-direction: column;
            }

            .my-order-card-header h3 {
                font-size: 27px;
            }

            .my-order-details {
                grid-template-columns: 1fr 1fr;
                gap: 20px 12px;
            }

            .order-detail-row span,
            .order-detail-row strong {
                font-size: 15px;
            }

            .customer-order-details h4 {
                font-size: 23px;
            }
        }

        /* ===============================
        MY ORDERS - PROFESSIONAL FONT
        ================================ */

        body {
            font-family: "Roboto", Arial, sans-serif;
        }

        .my-orders-title h1 {
            font-weight: 700;
            color: #222;
        }

        .my-orders-title p {
            font-weight: 400;
            color: #777;
        }

        .my-order-card-header h3 {
            font-weight: 700;
            color: #222;
        }

        .my-order-card-header span {
            font-weight: 500;
        }

        .order-detail-row span {
            font-weight: 600;
            color: #333;
        }

        .order-detail-row strong {
            font-weight: 600;
            color: #666;
        }

        .customer-order-details h4 {
            font-weight: 700;
            color: #222;
        }

        .customer-order-details p {
            font-weight: 400;
            color: #444;
        }

        .customer-order-details p strong {
            font-weight: 700;
            color: #222;
        }

        .back-home-btn {
            font-weight: 700;
        }

    </style>
</head>

<body>

    <div class="my-orders-page">

        <div class="my-orders-container">

            <a href=" /" class="back-home-btn">
                ← Back to FoodMunch
            </a>

            <div class="my-orders-title">
                <h1>📦 My Orders</h1>
                <p>Your previous food orders</p>
            </div>

            <div id="myOrderItems"
                 class="my-order-items">

                <div style="text-align:center; padding:40px;">
                    <h3>Loading your orders...</h3>
                    <p>Please wait...</p>
                </div>

            </div>

        </div>

    </div>


    <script>

    async function loadMyOrders() {

        const userId = localStorage.getItem("userId");

        if (!userId) {

            alert("Please login to view your orders.");

            window.location.href = "/login.html";

            return;
        }

        const myOrderItems =
            document.getElementById("myOrderItems");

        try {

            const response = await fetch(
            ` /my-orders/${userId}`
        );

            const result = await response.json();

            console.log("My Orders Response:", result);

            if (!result.success) {

                myOrderItems.innerHTML = `
                    <div style="text-align:center; padding:40px;">
                        <h3>Unable to load orders</h3>
                        <p>
                            ${result.message || "Something went wrong."}
                        </p>
                    </div>
                `;

                return;
            }

            const orders = result.orders;

            if (!orders || orders.length === 0) {

                myOrderItems.innerHTML = `
                    <div style="text-align:center; padding:50px 20px;">
                        <div style="font-size:60px;">📦</div>

                        <h3>No Orders Yet</h3>

                        <p>
                            You haven't placed any food orders yet.
                        </p>
                    </div>
                `;

                return;
            }

            myOrderItems.innerHTML = "";

            orders.forEach(function(order) {

                const orderCard =
                    document.createElement("div");

                orderCard.className = "my-order-card";

                orderCard.innerHTML = `

                    <div class="my-order-card-header">

                        <div>
                            <h3>${order.food_name}</h3>

                            <span>
                                Order #${order.id}
                            </span>
                        </div>

                        <span class="order-status">
                            Confirmed
                        </span>

                    </div>

                    <div class="my-order-details">

                        <div class="order-detail-row">
                            <span>🍽️ Food</span>
                            <strong>${order.food_name}</strong>
                        </div>

                        <div class="order-detail-row">
                            <span>💰 Price</span>
                            <strong>₹${order.price}</strong>
                        </div>

                        <div class="order-detail-row">
                            <span>🔢 Quantity</span>
                            <strong>${order.quantity}</strong>
                        </div>

                        <div class="order-detail-row">
                            <span>💵 Total</span>
                            <strong>₹${order.total_amount}</strong>
                        </div>

                        <div class="order-detail-row">
                            <span>💳 Payment</span>
                            <strong>${order.payment_method}</strong>
                        </div>

                        <div class="order-detail-row">
                            <span>📅 Ordered At</span>
                            <strong>${order.ordered_at}</strong>
                        </div>

                    </div>

                    <div class="customer-order-details">

                        <h4>Delivery Details</h4>

                        <p>
                            <strong>Name:</strong>
                            ${order.customer_name}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            ${order.customer_phone}
                        </p>

                        <p>
                            <strong>Address:</strong>
                            ${order.customer_address}
                        </p>

                    </div>

                `;

                myOrderItems.appendChild(orderCard);

            });

        }

        catch (error) {

            console.error(
                "Load My Orders Error:",
                error
            );

            myOrderItems.innerHTML = `
                <div style="text-align:center; padding:40px;">

                    <div style="font-size:50px;">
                        ⚠️
                    </div>

                    <h3>Unable to load orders</h3>

                    <p>
                        Please check your connection
                        and try again.
                    </p>

                </div>
            `;
        }
    }

    document.addEventListener(
        "DOMContentLoaded",
        loadMyOrders
    );

    </script>

</body>
</html>
